name: Wall Street Momentum Bot (24/5 Cloud)

on:
  # Lanzamiento manual desde el móvil/web
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Minutos de duración del turno (ej. 200)'
        required: false
        default: '200'

  # Horarios en UTC, robustos al cambio de hora verano/invierno de Madrid.
  # El propio bot decide cuándo operar según la hora de Madrid (15:30-22:00).
  # Turno 1: 13:00 UTC durante 200 min (hasta 16:20 UTC)
  # Turno 2: 16:15 UTC durante 280 min (hasta 20:55 UTC, cubre cierre 21:50 Madrid en verano e invierno)
  schedule:
    - cron: '0 13 * * 1-5'
    - cron: '15 16 * * 1-5'

# Evita que dos instancias se pisen: el turno 2 relevará al turno 1
concurrency:
  group: trading212-wallstreet-bot
  cancel-in-progress: true

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: "1"
      T212_API_KEY: ${{ secrets.T212_API_KEY }}
      T212_SECRET_KEY: ${{ secrets.T212_SECRET_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar librerías
        run: pip install -r requirements.txt

      - name: 🚀 Ejecutar Bot Wall Street (Turno Automático)
        run: |
          MINUTES="${{ github.event.inputs.max_minutes }}"
          if [ -z "$MINUTES" ]; then
            if [ "${{ github.event.schedule }}" = "15 16 * * 1-5" ]; then
              MINUTES=280
            else
              MINUTES=200
            fi
          fi
          python -X utf8 bot_t212_wallstreet.py --max-minutes "$MINUTES"
